// DO NOT EDIT THIS FILE! It is generated each time "capacitor update" is run

android {
  compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
  }
}

apply from: "../capacitor-cordova-android-plugins/build.gradle"

try {
    def capacitorPlugins = new groovy.json.JsonSlurper().parseText(new File('../capacitor.plugins.json').text)
    capacitorPlugins.each { plugin ->
        if (plugin.android != null) {
            def pluginPath = new File(plugin.android.path)
            if (pluginPath.exists()) {
                apply from: pluginPath
            }
        }
    }
} catch (Exception e) {
    logger.warn("capacitor.build.gradle: Error applying plugin configurations", e)
}
