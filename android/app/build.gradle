apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// ── Versioning CalVer ────────────────────────────────────────────
// android/version.properties est généré par `node scripts/generate-version.mjs`
// versionName : YYYY.M.PATCH   versionCode : YYYYMMDDHH
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionName = versionProps.getProperty('versionName', '2026.1.1')
def appVersionCode = Integer.parseInt(versionProps.getProperty('versionCode', '2026010101'))

// ── Signature stable ────────────────────────────────────────────
// Un keystore versionné (android/keystore/nutriscan-release.jks) garantit que
// tous les APK (debug ET release, locaux ou CI) portent la même signature :
// les mises à jour s'installent par-dessus l'APK existant sans désinstaller.
// Peut être surchargé par les variables d'env NUTRISCAN_KEYSTORE_*.
def ksFile = rootProject.file(System.getenv('NUTRISCAN_KEYSTORE_FILE') ?: 'keystore/nutriscan-release.jks')
def ksPass = System.getenv('NUTRISCAN_KEYSTORE_PASSWORD') ?: 'nutriscan'
def ksAlias = System.getenv('NUTRISCAN_KEY_ALIAS') ?: 'nutriscan'
def ksAliasPass = System.getenv('NUTRISCAN_KEY_PASSWORD') ?: 'nutriscan'

android {
    namespace = "com.nutriscan.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nutriscan.app"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation project(':capgo-capacitor-health')
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    // IA locale native (on-device).
    // - .litertlm : SDK moderne LiteRT-LM (Gemma 4 / Gemma 3 récents)
    // - .task     : ancien moteur MediaPipe LLM Inference, conservé en fallback
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.14.0'
    implementation 'com.google.mediapipe:tasks-genai:0.10.29'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
