// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Le moteur IA natif (com.google.mediapipe:tasks-genai:0.10.29) et
    // kotlinx-coroutines récents sont compilés avec une kotlin-stdlib 2.x.
    // On aligne donc tout l'écosystème Kotlin sur la 2.0.21 (compilateur +
    // stdlib) pour que les métadonnées soient lisibles : cela résout à la fois
    // les "Unresolved reference" (isNullOrBlank) et les erreurs de coroutines
    // (suspend / CancellationException).
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:2.0.21"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
