// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Le moteur IA natif (com.google.mediapipe:tasks-genai) tire une
    // kotlin-stdlib 2.x en transitif. Le compilateur Kotlin du projet est en
    // 1.9.25 et ne sait pas lire les métadonnées d'une stdlib 2.x, ce qui
    // provoque des "Unresolved reference" sur des fonctions standard comme
    // isNullOrBlank(). On force donc toute la stdlib Kotlin en 1.9.25.
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
