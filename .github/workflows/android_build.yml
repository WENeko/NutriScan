name: Build Android APK

on:
  push:
    # L'utilisation de '**' permet de déclencher le workflow sur n'importe quelle branche
    branches:
      - '**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Note: le fichier .env est versionné dans le repo avec les bonnes clés
      # (clé "publishable" Supabase, sans danger à committer). On ne le réécrit
      # plus depuis les secrets GitHub car des secrets vides/manquants
      # produisaient un APK avec une clé invalide ("invalid API key" au login).


      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/android@^8.0.0 @capacitor/core@^8.0.0 @capgo/capacitor-health@^8.4.2


      - name: Build web app
        run: npm run build

      - name: Verify dist folder
        run: |
          ls -la dist/
          cat dist/index.html | head -20

      - name: Clean and Sync Capacitor
        run: |
          # Nettoyage complet assets
          rm -rf android/app/src/main/assets/public/*
          # Vérifier que dist/index.html existe
          ls -la dist/index.html
          # Copier les assets web
          npx cap copy android
          # Vérifier la copie
          ls -la android/app/src/main/assets/public/
          # Sync complet
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13
        working-directory: android

        
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
