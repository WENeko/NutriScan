name: Build Android APK

on:
  push:
    # L'utilisation de '**' permet de déclencher le workflow sur n'importe quelle branche
    branches:
      - '**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Note: le fichier .env est versionné dans le repo avec les bonnes clés
      # (clé "publishable" Supabase, sans danger à committer). On ne le réécrit
      # plus depuis les secrets GitHub car des secrets vides/manquants
      # produisaient un APK avec une clé invalide ("invalid API key" au login).


      - name: Install dependencies
        run: npm ci

      # FF doit s'incrémenter à chaque build : le fichier android/version.properties
      # versionné est identique à chaque run, on repart donc du plus haut tag publié.
      - name: Compute previous versionCode from Git tags
        run: |
          git fetch --tags --force --quiet || true
          PREV=$(git tag -l 'v[0-9]*' \
            | sed 's/^v//' \
            | tr -d '.' \
            | grep -E '^[0-9]{10}$' \
            | sort -n | tail -n 1)
          echo "NUTRISCAN_PREV_VERSION_CODE=${PREV:-0}" >> "$GITHUB_ENV"
          echo "Previous versionCode: ${PREV:-none}"

      - name: Generate CalVer version (versionName YYYY.MM.DD.FF / versionCode YYYYMMDDFF)
        run: |
          node scripts/generate-version.mjs
          cat android/version.properties

      - name: Build web app
        run: npm run build

      - name: Verify dist folder
        run: |
          ls -la dist/
          cat dist/index.html | head -20

      - name: Clean and Sync Capacitor
        run: |
          # Nettoyage complet assets
          rm -rf android/app/src/main/assets/public/*
          # Vérifier que dist/index.html existe
          ls -la dist/index.html
          # Copier les assets web
          npx cap copy android
          # Vérifier la copie
          ls -la android/app/src/main/assets/public/
          # Sync complet
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (optimisé, minify + shrink)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Read version
        id: version
        run: echo "name=$(grep versionName android/version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Pas d'upload-artifact : le quota "Artifact storage" est limité.
      # Les APK sont publiés uniquement via GitHub Releases (hors quota artifacts).



      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release-files/NutriScan-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "release-files/NutriScan-${{ steps.version.outputs.name }}-debug.apk"
          ls -la release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: NutriScan ${{ steps.version.outputs.name }}
          body: |
            APK release signé (mise à jour par-dessus l'installation existante, sans désinstaller).
            Version ${{ steps.version.outputs.name }} — commit ${{ github.sha }}
          files: release-files/*.apk
          make_latest: true
          draft: false
          prerelease: false


