    <!-- DEBUG MOBILE: Capture des erreurs JS -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var errorMsg = 'ERREUR: ' + msg + '\\nURL: ' + url + '\\nLigne: ' + line + ':' + col;
        console.error(errorMsg);
        // Afficher sur l'écran pour debug mobile
        if (document.getElementById('root')) {
          document.getElementById('root').innerHTML = '<div style="padding:20px;color:red;font-family:monospace;white-space:pre-wrap;">' + errorMsg + '</div>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        var errorMsg = 'PROMISE REJETEE: ' + event.reason;
        console.error(errorMsg);
        if (document.getElementById('root')) {
          document.getElementById('root').innerHTML = '<div style="padding:20px;color:red;font-family:monospace;white-space:pre-wrap;">' + errorMsg + '</div>';
        }
      };
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
